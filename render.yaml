services:
  - type: web
    name: face-attendance-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Smaller than the 640 default - the free plan's 512MB RAM is tight for the face
      # model; this trims memory/CPU with only a small drop in small-face detection range.
      - key: DETECTION_SIZE
        value: "320"
      - key: SECRET_KEY
        generateValue: true
      # Encrypts stored face templates. Render will ask you to set this once; keep a
      # copy somewhere safe - losing or changing it makes existing enrolments unreadable.
      - key: EMBEDDING_ENCRYPTION_KEY
        sync: false
      # Neon/Supabase connection string, e.g. postgresql+psycopg://user:pass@host/db
      - key: DATABASE_URL
        sync: false
      # The frontend is served by this same service (single origin), so set this to this
      # service's own URL once Render assigns it, e.g. https://face-attendance-backend.onrender.com
      - key: CORS_ORIGINS
        sync: false
